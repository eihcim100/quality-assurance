<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .score-green { color: #16a34a; border-color: #22c55e; }
        .score-yellow { color: #ca8a04; border-color: #eab308; }
        .score-red { color: #dc2626; border-color: #ef4444; }
        
        .bg-score-green { background-color: #dcfce7; color: #166534; }
        .bg-score-yellow { background-color: #fef9c3; color: #854d0e; }
        .bg-score-red { background-color: #fee2e2; color: #991b1b; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media print {
            body * { visibility: hidden; }
            #report-modal, #report-modal * { visibility: visible; }
            #report-modal { position: absolute; left: 0; top: 0; background: white; padding: 0; }
            .print-hide { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center font-black text-slate-900 text-3xl mx-auto mb-6 shadow-md">
                M
            </div>
            <h1 class="text-2xl font-black uppercase tracking-tight mb-2">QA Admin Portal</h1>
            <p class="text-slate-500 text-sm mb-6 font-medium">Internal Detailer Verification</p>
            
            <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full p-4 border-2 border-slate-200 rounded-2xl mb-4 outline-none focus:border-yellow-400 transition-colors font-bold text-center">
            <button onclick="login()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-slate-800 transition-colors">Login</button>
            <p id="login-err" class="text-red-500 mt-4 hidden font-bold text-sm">Invalid Password</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-content" class="hidden">
        <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-slate-900 text-xl shadow-sm">M</div>
                    <div>
                        <h1 class="font-black uppercase italic text-lg leading-none tracking-tight">Contractor QA</h1>
                        <p class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Admin Dashboard</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-slate-800 transition-colors">Logout</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-4 md:p-6 mt-4">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-left min-w-[700px]">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-5 text-xs uppercase font-black tracking-widest text-slate-400">Date (CST)</th>
                            <th class="p-5 text-xs uppercase font-black tracking-widest text-slate-400">Contractor</th>
                            <th class="p-5 text-xs uppercase font-black tracking-widest text-slate-400">Vehicle & Service</th>
                            <th class="p-5 text-xs uppercase font-black tracking-widest text-slate-400">QA Score</th>
                            <th class="p-5 text-xs uppercase font-black tracking-widest text-slate-400 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reports-list">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Details Modal -->
    <div id="report-modal" class="fixed inset-0 bg-slate-900/90 hidden z-50 overflow-y-auto backdrop-blur-sm">
        <div class="flex min-h-full items-center justify-center p-4 md:p-8" onclick="if(event.target === this) closeModal()">
            <div class="bg-white w-full max-w-5xl rounded-[2rem] p-6 md:p-10 relative shadow-2xl">
                <button onclick="closeModal()" class="absolute top-4 right-4 md:top-6 md:right-6 w-12 h-12 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 hover:text-slate-900 flex items-center justify-center font-black text-xl transition-colors print-hide z-50">
                    &times;
                </button>
                
                <div id="modal-body" class="mt-2 md:mt-0">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const QUOTE_PHOTO_HOST = 'https://quote.michieauto.com';
        let allReports = [];

        function formatPhotoUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return QUOTE_PHOTO_HOST + (url.startsWith('/') ? '' : '/') + url;
        }

        async function login() {
            const pass = document.getElementById('admin-pass').value;
            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            if (res.ok) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                fetchReports();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        async function fetchReports() {
            try {
                const res = await fetch('/admin/reports');
                allReports = await res.json();
                renderReports();
            } catch(e) {
                console.error("Error fetching reports", e);
            }
        }

        function getScoreClass(score, isBackground = false) {
            const s = parseFloat(score);
            if (s >= 9.0) return isBackground ? 'bg-score-green' : 'score-green';
            if (s >= 7.5) return isBackground ? 'bg-score-yellow' : 'score-yellow';
            return isBackground ? 'bg-score-red' : 'score-red';
        }

        function formatCurrency(val) {
            if (!val || val === "N/A") return "N/A";
            const num = parseFloat(String(val).replace(/[^0-9.]/g, ''));
            return isNaN(num) ? val : '$' + num.toFixed(2);
        }

        function renderReports() {
            const container = document.getElementById('reports-list');
            if(allReports.length === 0) {
                container.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500 font-medium">No QA reports available.</td></tr>`;
                return;
            }

            container.innerHTML = allReports.map(report => {
                const scoreBg = getScoreClass(report.score, true);
                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                        <td class="p-5 text-sm font-medium text-slate-500">${report.timestamp}</td>
                        <td class="p-5">
                            <div class="font-black text-slate-900 uppercase tracking-wide">${report.contractor}</div>
                        </td>
                        <td class="p-5">
                            <div class="text-sm font-bold text-slate-900">${report.vehicle}</div>
                            <div class="text-[10px] uppercase font-black tracking-widest text-slate-400 mt-1">${report.serviceLevel}</div>
                        </td>
                        <td class="p-5">
                            <span class="${scoreBg} px-3 py-1 rounded-full text-sm font-black">${parseFloat(report.score).toFixed(1)}</span>
                        </td>
                        <td class="p-5 text-right space-x-2 whitespace-nowrap">
                            <button onclick="viewReport('${report.id}')" class="bg-yellow-400 text-slate-900 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-yellow-500 transition-colors">Review</button>
                            <button onclick="deleteReport('${report.id}')" class="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl inline-block align-middle transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewReport(id) {
            const report = allReports.find(r => r.id === id);
            const modal = document.getElementById('report-modal');
            const body = document.getElementById('modal-body');
            
            const scoreColor = getScoreClass(report.score, false);

            const clientName = report.clientName || 'N/A';
            const grossPrice = formatCurrency(report.price);
            const contractorPay = formatCurrency(report.contractorPay);
            const aiNotes = (report.aiNotes && report.aiNotes !== "N/A") ? report.aiNotes : 'No AI work order notes available.';
            const beforePhotos = report.beforePhotos || [];

            // Before Photos HTML
            let beforePhotosHTML = '';
            if (beforePhotos && beforePhotos.length > 0) {
                beforePhotosHTML = `
                    <div class="mb-8 page-break-inside-avoid">
                        <h3 class="text-xs font-black uppercase tracking-widest text-blue-600 mb-3">AI Scan - Before Photos</h3>
                        <div class="flex overflow-x-auto space-x-3 pb-3 no-scrollbar border border-slate-100 p-2 rounded-2xl bg-slate-50">
                            ${beforePhotos.map(url => `<img src="${formatPhotoUrl(url)}" class="h-32 w-32 object-cover rounded-xl shadow-sm flex-shrink-0 cursor-pointer" onclick="window.open('${formatPhotoUrl(url)}', '_blank')">`).join('')}
                        </div>
                    </div>
                `;
            }

            body.innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-8 border-b border-slate-200 pb-8 mb-8">
                    <!-- Score Circle -->
                    <div class="w-40 h-40 rounded-full flex flex-col items-center justify-center border-[10px] shadow-lg shrink-0 ${scoreColor}">
                        <span class="text-5xl font-black tracking-tighter">${parseFloat(report.score).toFixed(1)}</span>
                        <span class="text-[10px] uppercase tracking-widest font-bold opacity-50 mt-1">/ 10.0</span>
                    </div>

                    <div class="flex-1 w-full text-center md:text-left">
                        <p class="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-1">Contractor Under Review</p>
                        <h2 class="text-3xl font-black uppercase italic tracking-tight text-slate-900 mb-6">${report.contractor}</h2>
                        
                        <!-- Line-by-Line Job Details -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left mb-6 shadow-sm">
                            <div>
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Client Name</span>
                                <span class="text-sm font-bold text-slate-900">${clientName}</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Vehicle</span>
                                <span class="text-sm font-bold text-slate-900">${report.vehicle}</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Gross Price</span>
                                <span class="text-sm font-bold text-green-600">${grossPrice}</span>
                            </div>
                            <div>
                                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">Contractor Pay</span>
                                <span class="text-sm font-bold text-blue-600">${contractorPay}</span>
                            </div>
                        </div>

                        <!-- Detailer Notes / AI Summary -->
                        <div class="bg-blue-50 p-5 rounded-2xl text-sm font-medium text-blue-900 leading-relaxed border border-blue-100 shadow-sm text-left">
                            <span class="font-black uppercase tracking-widest text-[10px] text-blue-500 block mb-2">AI Work Order / Detailer Notes</span>
                            <div class="whitespace-pre-wrap">${aiNotes}</div>
                        </div>
                    </div>
                </div>

                ${beforePhotosHTML}

                <div class="flex justify-between items-end mb-6 print-hide">
                    <h3 class="text-lg font-black uppercase tracking-widest text-slate-900">Contractor After Photos & AI Feedback</h3>
                    <button onclick="window.print()" class="text-xs font-black uppercase tracking-widest text-blue-600 hover:text-blue-800 transition-colors">Save PDF</button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${report.analysis.map(item => `
                        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm page-break-inside-avoid flex flex-col">
                            <div class="bg-slate-50 border-b border-slate-200 px-4 py-3">
                                <p class="text-xs font-black uppercase tracking-widest text-slate-600">${item.label}</p>
                            </div>
                            <img src="${item.img}" class="w-full h-48 md:h-64 object-cover" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'#f1f5f9\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-family=\\'sans-serif\\' font-size=\\'12\\' fill=\\'#94a3b8\\'>Image Expired</text></svg>'">
                            <div class="p-4 flex-grow">
                                <p class="text-sm font-medium text-slate-700 leading-relaxed">"${item.feedback}"</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        async function deleteReport(id) {
            if (!confirm("Are you sure? This will permanently delete the report and all associated photos to save server space.")) return;
            
            try {
                const res = await fetch(`/admin/reports/${id}`, { method: 'DELETE' });
                if (res.ok) fetchReports();
            } catch(e) {
                alert("Failed to delete report.");
            }
        }

        function closeModal() { 
            document.getElementById('report-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
