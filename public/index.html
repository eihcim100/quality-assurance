        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);

            // Extract data from URL or local storage
            let vYear = urlParams.get('v-year') || formData.get('v-year') || localStorage.getItem('prefill-v-year');

            let vModel = urlParams.get('v-model') || formData.get('v-model') || localStorage.getItem('prefill-v-model');
            let sLevel = urlParams.get('s-level') || formData.get('s-level') || localStorage.getItem('prefill-s-level');

            if (vYear) document.getElementById('v-year').value = vYear;
            if (vMake) document.getElementById('v-make').value = vMake;
            if (vModel) document.getElementById('v-model').value = vModel;
            
            if (sLevel) {
                let options = document.getElementById('s-level').options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].text.toLowerCase().includes(sLevel.toLowerCase()) || options[i].value.toLowerCase().includes(sLevel.toLowerCase())) {
                        document.getElementById('s-level').selectedIndex = i;
                        break;
                    }
                }
            }

            // Clear local storage after use
            localStorage.removeItem('prefill-v-year');
            localStorage.removeItem('prefill-v-make');
            localStorage.removeItem('prefill-v-model');
            localStorage.removeItem('prefill-s-level');
        });
